[project]
name = "nse-eod"
version = "0.1.0"
description = "NSE corporate-action-adjusted EOD price pipeline (bronze/silver/gold)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "psycopg[binary,pool]>=3.2",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
nse-eod = "nse_eod.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nse_eod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live local Postgres (deselect with -m 'not integration')",
    "network: hits live NSE endpoints (deselect with -m 'not network')",
]
